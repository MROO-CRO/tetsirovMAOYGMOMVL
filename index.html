<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ГМО №1 МВЛ</title>
<style>
body{font-family:sans-serif;background:#ffe4ef;padding:20px;color:#333;text-align:center}
.hide{display:none!important}
.card{background:#fff;border:2px solid #ffd1e3;border-radius:10px;padding:20px;margin-bottom:15px;max-width:600px;margin-left:auto;margin-right:auto;text-align:left}
h1,h2,h3{color:#d6336c;text-align:center}
button{background:#ff5c8a;color:#fff;border:none;padding:10px 15px;border-radius:5px;cursor:pointer;margin:5px 0;font-size:15px}
button.ghost{background:#fff;color:#d6336c;border:2px solid #ffd1e3}
button.danger{background:#e63973}
input{width:100%;padding:10px;margin-bottom:10px;border:2px solid #ffd1e3;border-radius:5px;box-sizing:border-box}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:8px;text-align:left}th{background:#ffe4ef}
.opt{display:block;padding:10px;border:1px solid #ddd;margin-bottom:5px;border-radius:5px;cursor:pointer;background:#fff}
.code{font-family:monospace;font-weight:bold;color:#d6336c;background:#ffe4ef;padding:2px 6px;border-radius:4px}
.timer{position:fixed;top:10px;right:10px;background:#fff;padding:10px;border-radius:20px;border:2px solid #ffd1e3;font-weight:bold;color:#d6336c}
</style>
</head>
<body>

<div id="s-home">
  <h1>🌸 ГМО №1 МВЛ</h1>
  <button onclick="go('tests')">Перейти к тестам</button><br><br>
  <a href="#" onclick="go('login'); return false;">Вход для директора</a>
</div>

<div id="s-login" class="hide">
  <div class="card" style="text-align:center">
    <h3>Вход директора</h3>
    <input type="password" id="pwd" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <button class="ghost" onclick="go('home')">Назад</button>
  </div>
</div>

<div id="s-admin" class="hide">
  <div class="card"><h2>Панель директора</h2><button class="ghost" onclick="go('home')">Выйти</button></div>
  
  <div class="card">
    <h3>Добавить учителя (создать код)</h3>
    <input id="stFio" placeholder="ФИО">
    <input id="stLoad" placeholder="Должность (Учитель ИЗО)">
    <button onclick="addStaff()">Создать код</button>
    <div id="staffList" style="margin-top:15px"></div>
  </div>

  <div class="card">
    <h3>Создать тест</h3>
    <input id="nTitle" placeholder="Название теста">
    <input id="nDl" type="datetime-local">
    <div style="display:flex;gap:10px">
      <input type="number" id="g5" value="90" placeholder="5 (%)">
      <input type="number" id="g4" value="75" placeholder="4 (%)">
      <input type="number" id="g3" value="50" placeholder="3 (%)">
    </div>
    <div id="nQs"></div>
    <button onclick="addQ()">+ Вопрос</button>
    <button onclick="saveTest()">Сохранить</button>
  </div>

  <div class="card">
    <h3>Созданные тесты</h3>
    <div id="admTests"></div>
  </div>

  <div class="card">
    <h3>Результаты</h3>
    <button onclick="loadRes()">Обновить</button>
    <div id="resList"></div>
  </div>
</div>

<div id="s-tests" class="hide">
  <div class="card">
    <button class="ghost" onclick="go('home')">Назад</button>
    <h2>Вход по коду</h2>
    <div id="codeBlock">
      <input id="tCode" placeholder="Введите код" style="text-transform:uppercase">
      <button onclick="checkAccess()">Войти</button>
    </div>
    <div id="teacherList" class="hide" style="margin-top:15px">
      <h3 style="color:green;">Доступные тесты</h3>
      <div id="testsList"></div>
    </div>
  </div>
</div>

<div id="s-test" class="hide">
  <div class="card">
    <button class="ghost" onclick="go('tests')">Назад</button>
    <div id="tContent"></div>
  </div>
</div>

<script>
const PWD = "direktor2024";
const getS = () => JSON.parse(localStorage.getItem('gm_staff') || '[]');
const setS = a => localStorage.setItem('gm_staff', JSON.stringify(a));
const getT = () => JSON.parse(localStorage.getItem('gm_tests') || '[]');
const setT = a => localStorage.setItem('gm_tests', JSON.stringify(a));
const getR = () => JSON.parse(localStorage.getItem('gm_results') || '[]');
const setR = a => localStorage.setItem('gm_results', JSON.stringify(a));

let currentTeacher = null, t0 = null, tmr = null;

function go(n) {
  document.querySelectorAll('[id^="s-"]').forEach(e => e.classList.add('hide'));
  document.getElementById('s-'+n).classList.remove('hide');
  if (n === 'admin') { loadStaff(); loadAdm(); loadRes(); }
}
window.go = go;

function login() { if(document.getElementById('pwd').value === PWD) go('admin'); else alert('Неверный пароль'); }
window.login = login;

function addStaff() {
  const fio = document.getElementById('stFio').value.trim();
  const load = document.getElementById('stLoad').value.trim();
  if(!fio || !load) return alert('Заполните поля!');
  const a = getS();
  const code = Math.random().toString(36).substring(2,5).toUpperCase() + '-' + Math.random().toString(36).substring(2,5).toUpperCase();
  a.push({fio, load, code}); setS(a);
  alert('Код: ' + code);
  document.getElementById('stFio').value = ''; document.getElementById('stLoad').value = ''; loadStaff();
}
window.addStaff = addStaff;

function loadStaff() {
  const L = document.getElementById('staffList'); const a = getS();
  L.innerHTML = a.map((s,i)=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0">
    <span><b>${s.fio}</b> (${s.load})</span><span>Код: <span class="code">${s.code}</span> <button class="danger" onclick="delStaff(${i})">X</button></span>
  </div>`).join('');
}

function delStaff(i) { const a = getS(); a.splice(i, 1); setS(a); loadStaff(); }
window.delStaff = delStaff;

function checkAccess() {
  const code = document.getElementById('tCode').value.trim().toUpperCase();
  const s = getS().find(x => x.code === code);
  if(!s) return alert('Код не найден!');
  currentTeacher = s;
  document.getElementById('codeBlock').classList.add('hide');
  document.getElementById('teacherList').classList.remove('hide');
  loadTests();
}
window.checkAccess = checkAccess;

function addQ() {
  const d = document.createElement('div');
  d.style = 'border:1px solid #ddd;padding:10px;margin-bottom:10px;border-radius:5px';
  d.innerHTML = `<input placeholder="Вопрос" class="qtext"><div class="opts"></div>
  <button onclick="addO(this)" style="font-size:12px;padding:5px">+ вариант</button>
  <button class="danger" onclick="this.parentElement.remove()" style="font-size:12px;padding:5px">Удалить</button>`;
  document.getElementById('nQs').appendChild(d); addO(d.querySelector('button'));
}
window.addQ = addQ;

function addO(b) {
  const o = b.parentElement.querySelector('.opts'), r = document.createElement('div');
  r.style = 'display:flex;gap:10px;margin-top:5px';
  r.innerHTML = `<input type="radio" name="c${Math.random()}" style="width:auto"> <input type="text" class="otext" placeholder="Ответ">`;
  o.appendChild(r);
}
window.addO = addO;

function saveTest() {
  const title = document.getElementById('nTitle').value;
  const dl = document.getElementById('nDl').value;
  const g5 = +document.getElementById('g5').value;
  const g4 = +document.getElementById('g4').value;
  const g3 = +document.getElementById('g3').value;
  if(!title || !dl) return alert('Заполните название и дату');
  
  const qs = [];
  document.querySelectorAll('#nQs > div').forEach(b => {
    const text = b.querySelector('.qtext').value, ors = [...b.querySelectorAll('.opts input[type=radio]')], opts = [...b.querySelectorAll('.otext')].map(x => x.value);
    const cor = ors.findIndex(r => r.checked);
    if(text && opts.length > 1 && cor > -1) qs.push({text, options: opts, correct: cor});
  });
  if(!qs.length) return alert('Нужен 1 вопрос');
  
  const a = getT();
  a.push({id: Date.now().toString(), title, deadline: dl, questions: qs, grades: {g5, g4, g3}});
  setT(a);
  alert('Создан!');
  document.getElementById('nTitle').value = ''; document.getElementById('nQs').innerHTML = ''; addQ(); loadAdm();
}
window.saveTest = saveTest;

function loadAdm() {
  const a = getT();
  document.getElementById('admTests').innerHTML = a.map(t => `<div style="display:flex;justify-content:space-between;margin-top:10px;border-bottom:1px solid #eee;padding-bottom:5px">
    <b>${t.title}</b>
    <button class="danger" onclick="if(confirm('Удалить этот тест?')) { delT('${t.id}'); }" style="padding:2px 5px">Удалить</button>
  </div>`).join('');
}

function delT(id) { setT(getT().filter(x => x.id !== id)); loadAdm(); }
window.delT = delT;

function loadTests() {
  const L = document.getElementById('testsList');
  const a = getT(); const r = getR();
  if(!a.length){ L.innerHTML = '<p>Нет тестов</p>'; return; }
  L.innerHTML = a.map(x => {
    const passed = r.some(y => y.test_id == x.id && y.fio.toLowerCase() === currentTeacher.fio.toLowerCase());
    return `<div style="display:flex;justify-content:space-between;margin-top:10px;border-bottom:1px solid #eee;padding-bottom:5px">
      <span><b>${x.title}</b><br><small>До: ${new Date(x.deadline).toLocaleString()}</small></span>
      ${passed ? '<b style="color:green">✓ Сдано</b>' : `<button onclick="take('${x.id}')" style="padding:5px 10px">Пройти</button>`}
    </div>`;
  }).join('');
}

function take(id) {
  const cur = getT().find(x => x.id == id);
  go('test');
  let h = `<h3>${cur.title}</h3><p>Учитель: ${currentTeacher.fio}</p>`;
  cur.questions.forEach((q,i) => {
    h += `<div class="card"><b>${i+1}. ${q.text}</b><br>`;
    q.options.forEach((o,j) => { h += `<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`; });
    h += '</div>';
  });
  h += `<button onclick="submitT('${id}')" style="width:100%;font-size:18px">Отправить</button>`;
  document.getElementById('tContent').innerHTML = h;
  
  t0 = Date.now();
  const old = document.getElementById('tmr'); if(old) old.remove();
  const d = document.createElement('div'); d.className = 'timer'; d.id = 'tmr'; d.textContent = '⏱ 0:00'; document.body.appendChild(d);
  tmr = setInterval(() => { const s = Math.floor((Date.now() - t0)/1000); d.textContent = `⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }, 1000);
}
window.take = take;

function submitT(id) {
  const cur = getT().find(x => x.id == id);
  const ans = cur.questions.map((_,i) => { const c = document.querySelector(`input[name="q${i}"]:checked`); return c ? +c.value : -1; });
  let score = 0; cur.questions.forEach((q,i) => { if(ans[i] === q.correct) score++; });
  const dur = t0 ? Math.round((Date.now() - t0)/1000) : 0;
  
  const r = getR();
  r.push({test_id: cur.id, test_title: cur.title, fio: currentTeacher.fio, load: currentTeacher.load, answers: ans, score: score, total: cur.questions.length, duration_sec: dur, submitted_at: new Date().toISOString()});
  setR(r);
  
  clearInterval(tmr); const old = document.getElementById('tmr'); if(old) old.remove();
  document.getElementById('tContent').innerHTML = `<div style="text-align:center"><h2>Отправлено!</h2><h1>${score} / ${cur.questions.length}</h1><button onclick="go('tests'); loadTests();">К тестам</button></div>`;
}
window.submitT = submitT;

function loadRes() {
  const a = getR(); const ts = getT();
  const getG = (s,t,g) => { const p = (s/t)*100; if(p >= g.g5) return 5; if(p >= g.g4) return 4; if(p >= g.g3) return 3; return 2; };
  let h = '<table><tr><th>ФИО</th><th>Тест</th><th>Баллы</th><th>Оценка</th></tr>';
  a.forEach(r => {
    const t = ts.find(x => x.id == r.test_id); let g = '-';
    if(t) g = getG(r.score, r.total, t.grades);
    h += `<tr><td>${r.fio}</td><td>${r.test_title}</td><td>${r.score}/${r.total}</td><td><b>${g}</b></td></tr>`;
  });
  h += '</table>'; document.getElementById('resList').innerHTML = h;
}

addQ();
</script>
</body>
</html>
