<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ГМО №1 МВЛ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<!-- Подключаем библиотеку Supabase для синхронизации -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#ffe4ef,#ffd6e8,#ffeef7);min-height:100vh;padding:20px;color:#7a5a66}.wrap{max-width:900px;margin:0 auto}.hide{display:none!important}
.hero{background:#fff;border-radius:20px;padding:40px 20px;max-width:600px;margin:40px auto;text-align:center;border:2px solid #ffd1e3;box-shadow:0 10px 30px rgba(255,150,190,.3)}
h1,h2,h3{color:#d6336c;margin-bottom:10px}
.btn{background:#ff5c8a;color:#fff;padding:12px 24px;border-radius:20px;border:none;font-weight:600;cursor:pointer;margin:4px;transition:.2s}.btn.ghost{background:#fff;color:#d6336c;border:2px solid #ffd1e3}.btn.sm{padding:6px 12px;font-size:13px}.btn.danger{background:#e63973}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(255,92,138,.4)}
.card{background:#fff;border:2px solid #ffd1e3;border-radius:15px;padding:20px;margin-bottom:15px}
input{width:100%;padding:10px;border-radius:8px;border:2px solid #ffd1e3;box-sizing:border-box;margin-bottom:10px}
.item{background:#fff;border:2px solid #ffd1e3;border-radius:15px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.opt{display:block;padding:10px;border-radius:8px;border:1px solid #eee;margin-bottom:5px;cursor:pointer;background:#fff}.opt input{width:auto;margin-right:10px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}th{color:#d6336c}
.code{font-family:monospace;font-weight:bold;font-size:16px;color:#d6336c;background:#ffe4ef;padding:2px 6px;border-radius:4px}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}[id^="s-"],.card,.item{animation:slideUp .3s ease-out forwards}
</style>
</head>
<body>

<div id="s-home" class="wrap">
  <div class="card hero">
    <h1>🌸 ГМО №1 МВЛ</h1>
    <p>Официальный сайт для тестирований</p>
    <button class="btn" onclick="go('tests')">Перейти к тестам</button><br><br>
    <a href="#" onclick="go('login');return false" style="color:#d6336c">Вход для директора</a>
  </div>
</div>

<div id="s-tests" class="wrap hide">
  <button class="btn ghost" onclick="go('home')">← Назад</button>
  <div id="teacherLogin" class="card" style="margin-top:15px;text-align:center">
    <h3>Вход по коду</h3>
    <p style="font-size:14px;margin-bottom:15px">Введите код, который выдал директор.</p>
    <input id="tCode" placeholder="Напр. A1B-2C3" style="text-align:center;font-size:18px;text-transform:uppercase;font-weight:bold">
    <button class="btn" onclick="checkAccess()" style="width:100%">Войти</button>
  </div>
  <div id="teacherList" class="hide">
    <div style="text-align:right;margin-bottom:10px"><button class="btn ghost sm" onclick="logoutTeacher()">Сменить код</button></div>
    <h2>Доступные тесты</h2><div id="testsList"></div>
  </div>
</div>

<div id="s-test" class="wrap hide">
  <button class="btn ghost" onclick="go('tests')">← Назад</button>
  <div id="testContent"></div>
</div>

<div id="s-login" class="wrap hide">
  <div class="card" style="max-width:400px;margin:50px auto;text-align:center">
    <h3>Вход директора</h3>
    <input type="password" id="pwd" placeholder="Пароль">
    <button class="btn" onclick="login()" style="width:100%">Войти</button>
  </div>
</div>

<div id="s-admin" class="wrap hide">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2>👑 Панель директора</h2><button class="btn ghost sm" onclick="go('home')">Выйти</button>
  </div>
  <div class="card">
    <h3>Добавить сотрудника (создать код)</h3>
    <input id="stFio" placeholder="ФИО учителя">
    <input id="stLoad" placeholder="Должность (Учитель ИЗО)">
    <button class="btn" onclick="addStaff()">➕ Создать код доступа</button>
    <div id="staffList" style="margin-top:15px"></div>
  </div>
  <div class="card"><h3>Создать тест</h3>
    <input id="nTitle" placeholder="Название теста"><input id="nDl" type="datetime-local">
    <div style="display:flex;gap:10px"><input type="number" id="g5" value="90" placeholder="5 (%)"><input type="number" id="g4" value="75" placeholder="4 (%)"><input type="number" id="g3" value="50" placeholder="3 (%)"></div>
    <div id="nQs"></div>
    <button class="btn ghost" onclick="addQ()">+ Вопрос</button>
    <button class="btn" onclick="saveTest()">💾 Сохранить</button>
  </div>
  <div class="card"><h3>Созданные тесты</h3><div id="admTests"></div></div>
  <div class="card"><h3>Результаты</h3><button class="btn ghost" onclick="loadRes()">🔄 Обновить</button><div id="resList"></div></div>
</div>

<script>
const PWD="direktor2024"; 
// ПОДКЛЮЧЕНИЕ БАЗЫ ДАННЫХ SUPABASE
const supabase = window.supabase.createClient("https://ixrwwpkwqmtquxjsksan.supabase.co", "sb_publishable_IaZzughtAZNtfZqkKNW9uQ_Gq3fOAhJ");
const $=id=>document.getElementById(id);

// Асинхронные функции для получения данных из облака
async function getT(){ const {data}=await supabase.from('tests').select('*'); return data||[]; }
async function getR(){ const {data}=await supabase.from('results').select('*'); return data||[]; }
// Сотрудников (коды) оставим в памяти, так как их создает только директор на своем ПК
const getS=()=>JSON.parse(localStorage.getItem('gm_staff')||'[]'), setS=a=>localStorage.setItem('gm_staff',JSON.stringify(a));

function go(n){
  document.querySelectorAll('[id^="s-"]').forEach(e=>e.classList.add('hide'));
  $('s-'+n).classList.remove('hide');
  if(n==='tests'){
    const t=JSON.parse(sessionStorage.getItem('teacher')||'null');
    $('teacherLogin').classList.toggle('hide',!!t);
    $('teacherList').classList.toggle('hide',!t);
    if(t) loadTests();
  }
  if(n==='admin'){ loadAdm(); loadStaff(); loadRes(); }
}
window.go=go;

function checkAccess(){
  const code = $('tCode').value.trim().toUpperCase();
  const staff = getS().find(x => x.code === code);
  if(!staff) return alert('Код не найден!');
  sessionStorage.teacher = JSON.stringify(staff);
  go('tests');
}
window.checkAccess=checkAccess;

function logoutTeacher(){ sessionStorage.removeItem('teacher'); go('tests'); }
window.logoutTeacher=logoutTeacher;

function login(){ if($('pwd').value===PWD){ go('admin'); } else alert('Неверный пароль'); }
window.login=login;

async function loadTests(){
  const L=$('testsList'), a=await getT(), t=JSON.parse(sessionStorage.getItem('teacher')), r=await getR();
  if(!a.length){ L.innerHTML='<div class="card">Нет тестов</div>'; return; }
  L.innerHTML=a.map(x=>{
    const passed = r.some(y => y.test_id==x.id && y.fio.toLowerCase()===t.fio.toLowerCase());
    return `<div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div><b>${x.title}</b><br><small>До: ${new Date(x.deadline).toLocaleString()}</small></div>
      ${passed ? '<b style="color:green">✓ Сдано</b>' : `<button class="btn" onclick="take('${x.id}')">Пройти</button>`}
    </div>`;
  }).join('');
}

async function take(id){
  const a=await getT(); const cur=a.find(x=>x.id==id); go('test');
  const t=JSON.parse(sessionStorage.getItem('teacher'));
  let h=`<div class="card"><h2>${cur.title}</h2><p><b>Учитель:</b> ${t.fio} (${t.load})</p></div>`;
  const qs = typeof cur.questions === 'string' ? JSON.parse(cur.questions) : cur.questions;
  qs.forEach((q,i)=>{
    h+=`<div class="card"><b>${i+1}. ${q.text}</b><br>`;
    q.options.forEach((o,j)=>{ h+=`<label class="opt" onclick="sel(this)"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`; });
    h+='</div>';
  });
  h+=`<button class="btn" onclick="submitT('${id}')" style="width:100%">Отправить</button>`;
  $('testContent').innerHTML=h;
}
window.take=take;

function sel(l){ const n=l.querySelector('input').name; document.querySelectorAll(`input[name="${n}"]`).forEach(i=>i.closest('.opt').style.background='#fff'); l.style.background='#ffe4ef'; }
window.sel=sel;

async function submitT(id){
  const t=JSON.parse(sessionStorage.getItem('teacher'));
  const a=await getT(); const cur=a.find(x=>x.id==id);
  const qs = typeof cur.questions === 'string' ? JSON.parse(cur.questions) : cur.questions;
  const ans = qs.map((_,i)=>{ const c=document.querySelector(`input[name="q${i}"]:checked`); return c?+c.value:-1; });
  let score=0; qs.forEach((q,i)=>{ if(ans[i]===q.correct) score++; });
  
  // Отправляем результат в облако Supabase
  await supabase.from('results').insert([{ test_id: String(cur.id), test_title: cur.title, fio: t.fio, load: t.load, answers: ans, score: score, total: qs.length, submitted_at: new Date().toISOString() }]);
  
  $('testContent').innerHTML=`<div class="card" style="text-align:center"><h2>Отправлено!</h2><h1>${score} / ${qs.length}</h1><button class="btn" onclick="go('tests')">К тестам</button></div>`;
}
window.submitT=submitT;

function addStaff(){
  const fio=$('stFio').value.trim(), load=$('stLoad').value.trim();
  if(!fio||!load) return alert('Заполните поля!');
  const a=getS();
  const code=Math.random().toString(36).substring(2,5).toUpperCase()+'-'+Math.random().toString(36).substring(2,5).toUpperCase();
  a.push({fio,load,code}); setS(a);
  alert('Сотрудник добавлен!\nКод: '+code); $('stFio').value=''; $('stLoad').value=''; loadStaff();
}
window.addStaff=addStaff;

function loadStaff(){
  const L=$('staffList'), a=getS();
  L.innerHTML=a.map((s,i)=>`<div class="item"><div><b>${s.fio}</b><br>${s.load}</div><div><span class="code">${s.code}</span> <button class="btn danger sm" onclick="setS(getS().filter((x,j)=>j!==${i}));loadStaff()">X</button></div></div>`).join('');
}

function addQ(){
  const d=document.createElement('div'); d.className='card'; d.style.background='#fcfcfc';
  d.innerHTML=`<input placeholder="Вопрос" class="qtext"><div class="opts"></div><button class="btn ghost sm" onclick="addO(this)">+ вариант</button><button class="btn danger sm" onclick="this.closest('.card').remove()">Удалить</button>`;
  $('nQs').appendChild(d); addO(d.querySelector('.btn'));
}
window.addQ=addQ;

function addO(b){
  const o=b.parentElement.querySelector('.opts'), r=document.createElement('div');
  r.innerHTML=`<input type="radio" name="c${Math.random()}" style="width:auto"> <input type="text" class="otext" placeholder="Ответ" style="width:80%">`;
  o.appendChild(r);
}
window.addO=addO;

async function saveTest(){
  const title=$('nTitle').value, dl=$('nDl').value, g5=+$('g5').value, g4=+$('g4').value, g3=+$('g3').value;
  if(!title||!dl) return alert('Заполните поля');
  const qs=[];
  document.querySelectorAll('#nQs .card').forEach(b=>{
    const text=b.querySelector('.qtext').value, ors=[...b.querySelectorAll('.opts input[type=radio]')], opts=[...b.querySelectorAll('.otext')].map(x=>x.value);
    let cor=ors.findIndex(r=>r.checked);
    if(text && opts.length>1 && cor>-1) qs.push({text,options:opts,correct:cor});
  });
  if(!qs.length) return alert('Нужен 1 вопрос');
  
  // Сохраняем тест в облако
  const {error} = await supabase.from('tests').insert([{ title, deadline:dl, questions: JSON.stringify(qs), grades: JSON.stringify({g5,g4,g3}) }]);
  if(error) return alert('Ошибка базы: '+error.message);
  
  alert('Создан!'); $('nTitle').value=''; $('nQs').innerHTML=''; addQ(); loadAdm();
}
window.saveTest=saveTest;

async function loadAdm(){
  const a=await getT();
  $('admTests').innerHTML=a.map(t=>`<div class="item"><div><b>${t.title}</b></div><button class="btn danger sm" onclick="supabase.from('tests').delete().eq('id','${t.id}').then(()=>loadAdm())">Удалить</button></div>`).join('');
}

async function loadRes(){
  const a=await getR(); const ts=await getT();
  const getG=(s,t,g)=>{const p=(s/t)*100; if(p>=g.g5)return 5; if(p>=g.g4)return 4; if(p>=g.g3)return 3; return 2;};
  let h='<table><tr><th>ФИО</th><th>Тест</th><th>Оценка</th></tr>';
  a.forEach(r=>{
    const t=ts.find(x=>x.id==r.test_id); let g='-';
    if(t){ const gr=typeof t.grades==='string'?JSON.parse(t.grades):t.grades; g=getG(r.score,r.total,gr); }
    h+=`<tr><td>${r.fio}</td><td>${r.test_title}</td><td><b>${g}</b></td></tr>`;
  });
  h+='</table>'; $('resList').innerHTML=h;
}

addQ();
</script>
</body>
</html>
