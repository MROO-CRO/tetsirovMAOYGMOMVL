<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const PWD="direktor2024"; 
// ВАШИ КЛЮЧИ SUPABASE:
const supabase = window.supabase.createClient("https://ixrwwpkwqmtquxjsksan.supabase.co", "sb_publishable_IaZzughtAZNtfZqkKNW9uQ_Gq3fOAhJ");

const $=id=>document.getElementById(id), esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Получение данных из облака
async function getT(){ const {data}=await supabase.from('tests').select('*'); return data||[]; }
async function getR(){ const {data}=await supabase.from('results').select('*'); return data||[]; }
// Сотрудников (коды) оставим в памяти браузера директора
const getS=()=>JSON.parse(localStorage.getItem('gm_staff')||'[]'), setS=a=>localStorage.setItem('gm_staff',JSON.stringify(a));

function go(n){document.querySelectorAll('[id^="s-"]').forEach(e=>e.classList.add('hide'));$('s-'+n)?.classList.remove('hide');scrollTo(0,0);if(n==='tests'){const t=JSON.parse(sessionStorage.getItem('teacher')||'null');$('codeBlock').classList.toggle('hide',!!t);$('testsBlock').classList.toggle('hide',!t);if(t)loadTests();else $('whoami').textContent='';}if(n==='admin'){switchTab('tests');loadAdm();loadStaff();loadRes()}} window.go=go;
function switchTab(n){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));$('tab-'+n).classList.add('active');['tests','staff','res'].forEach(x=>$('view-'+x).classList.toggle('hide',x!==n))} window.switchTab=switchTab;

function checkAccess(){const code=$('accessCode').value.trim().toUpperCase();if(!code)return;const s=getS().find(x=>x.code===code);if(!s)return alert('Код не найден!');sessionStorage.teacher=JSON.stringify({fio:s.fio,load:s.load});$('accessCode').value='';$('whoami').textContent=`👤 ${s.fio} (${s.load})`;$('codeBlock').classList.add('hide');$('testsBlock').classList.remove('hide');loadTests()} window.checkAccess=checkAccess;
function logoutTeacher(){sessionStorage.removeItem('teacher');$('whoami').textContent='';$('codeBlock').classList.remove('hide');$('testsBlock').classList.add('hide')} window.logoutTeacher=logoutTeacher;
function login(){if($('pwd').value===PWD){sessionStorage.isAdm='1';$('pwd').value='';go('admin')}else alert('Неверный пароль')} window.login=login;
function logoutAdmin(){sessionStorage.removeItem('isAdm');go('home')} window.logoutAdmin=logoutAdmin;

async function loadTests(){
  const L=$('testsList'), a=await getT(), t=JSON.parse(sessionStorage.getItem('teacher')||'null');
  if(!t)return; if(!a.length){L.innerHTML='<div class="card" style="text-align:center;color:#a06a7c">Нет тестов</div>';return}
  const res = await getR();
  L.innerHTML=a.map(x=>{
    const dl=x.deadline?new Date(x.deadline).toLocaleString('ru-RU'):'—';
    const passed=res.some(r=>r.test_id==x.id&&r.fio.trim().toLowerCase()===t.fio.trim().toLowerCase());
    return`<div class="item"><div><h3>${esc(x.title)}</h3><div class="dl">До: <b>${dl}</b></div></div>${passed?'<span style="color:#3cbc6e;font-weight:700">✓ Сдано</span>':`<button class="btn" onclick="take('${x.id}')">Пройти →</button>`}</div>`
  }).join('')
} window.loadTests=loadTests;

let cur=null,t0=null,tmr=null;
async function take(id){
  const a=await getT(); cur=a.find(x=>x.id==id); 
  if(!cur)return alert('Тест не найден');
  history.pushState({},'','?id='+id);go('test');
  const t=JSON.parse(sessionStorage.getItem('teacher')||'null');
  $('tTitle').textContent=cur.title;$('tDl').innerHTML=cur.deadline?`До: <b>${new Date(cur.deadline).toLocaleString('ru-RU')}</b>`:'';
  let h=`<div class="card" style="background:#fff7fa"><label class="lbl">ФИО</label><input value="${esc(t.fio)}" disabled style="font-weight:bold;background:#fff"><label class="lbl">Нагрузка</label><input value="${esc(t.load)}" disabled style="font-weight:bold;background:#fff"></div>`;
  const qs = typeof cur.questions === 'string' ? JSON.parse(cur.questions) : cur.questions;
  qs.forEach((q,i)=>{h+=`<div class="card"><div class="q">${i+1}. ${esc(q.text)}</div>${q.options.map((o,j)=>`<label class="opt" onclick="sel(this)"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div>`});
  h+=`<button class="btn" style="width:100%" onclick="submitT()">Отправить</button>`;
  $('tContent').innerHTML=h;startTimer();
} window.take=take;

function sel(l){const n=l.querySelector('input').name;document.querySelectorAll(`input[name="${n}"]`).forEach(i=>i.closest('.opt').classList.remove('sel'));l.classList.add('sel')} window.sel=sel;
function startTimer(){if(tmr)clearInterval(tmr);t0=Date.now();$('tmr')?.remove();const d=document.createElement('div');d.className='timer';d.id='tmr';d.textContent='⏱ 0:00';document.body.appendChild(d);tmr=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);d.textContent=`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},1000)}

async function submitT(){
  const t=JSON.parse(sessionStorage.getItem('teacher')||'null');
  const rA=await getR();
  if(rA.some(r=>r.test_id==cur.id&&r.fio.trim().toLowerCase()===t.fio.trim().toLowerCase()))return alert('Вы уже сдавали!');
  const qs = typeof cur.questions === 'string' ? JSON.parse(cur.questions) : cur.questions;
  const ans=qs.map((_,i)=>{const c=document.querySelector(`input[name="q${i}"]:checked`);return c?+c.value:-1}),dur=t0?Math.round((Date.now()-t0)/1000):0;
  let score=0;qs.forEach((q,i)=>{if(ans[i]===q.correct)score++});
  const total=qs.length;
  
  await supabase.from('results').insert([{test_id:String(cur.id),test_title:cur.title,fio:t.fio,load:t.load,answers:ans,score,total,duration_sec:dur,submitted_at:new Date().toISOString()}]);
  
  clearInterval(tmr);$('tmr')?.remove();
  const pct=Math.round((score/total)*100);
  $('tContent').innerHTML=`<div class="result"><h2>Завершено!</h2><div class="score">${score} / ${total}</div><p>Процент: <b>${pct}%</b><br>Время: ${Math.floor(dur/60)}м ${dur%60}с</p><button class="btn" style="margin-top:20px" onclick="go('tests')">← К тестам</button></div>`
} window.submitT=submitT;

function addStaff(){const fio=$('stFio').value.trim(),load=$('stLoad').value.trim();if(!fio||!load)return alert('Заполните поля!');const a=getS();if(a.some(s=>s.fio.trim().toLowerCase()===fio.toLowerCase()))return alert('Уже есть!');const gen=()=>Math.random().toString(36).substring(2,5).toUpperCase()+'-'+Math.random().toString(36).substring(2,5).toUpperCase();let code=gen();while(a.some(s=>s.code===code))code=gen();a.push({id:Date.now().toString(),fio,load,code});setS(a);alert(`Сотрудник добавлен!\nКод: ${code}`);$('stFio').value='';$('stLoad').value='';loadStaff()} window.addStaff=addStaff;
function loadStaff(){const L=$('staffList'),a=getS();if(!a.length){L.innerHTML='<p style="color:#a06a7c">Список пуст</p>';return}L.innerHTML=a.map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ffe4ef;flex-wrap:wrap;gap:10px"><div><b>${esc(s.fio)}</b><br><small>${esc(s.load)}</small></div><div style="display:flex;align-items:center;gap:10px"><span class="code-txt">${s.code}</span><button class="btn danger sm" onclick="delStaff('${s.id}')">Удалить</button></div></div>`).join('')} window.loadStaff=loadStaff;
function delStaff(id){if(!confirm('Удалить?'))return;setS(getS().filter(s=>s.id!=id));loadStaff()} window.delStaff=delStaff;

function addQ(){const d=document.createElement('div');d.className='qb';d.style.cssText='background:#fff7fa;padding:12px;border-radius:12px;margin-bottom:10px';d.innerHTML=`<input placeholder="Вопрос" class="qtext" style="font-weight:600"><div class="opts"></div><div style="display:flex;gap:8px;margin-top:6px"><button type="button" class="btn ghost sm" onclick="addO(this)">+ вариант</button><button type="button" class="btn danger sm" onclick="this.closest('.qb').remove()" style="margin-left:auto">Удалить</button></div>`;$('nQs').appendChild(d);addO(d.querySelector('.btn.ghost'))} window.addQ=addQ;
function addO(b){const o=b.parentElement.parentElement.querySelector('.opts'),r=document.createElement('div');r.className='orow';r.style.cssText='display:flex;gap:8px;margin-bottom:6px';r.innerHTML=`<input type="radio" name="c${Math.random()}" style="width:auto"><input type="text" placeholder="Вариант ${o.children.length+1}" style="margin:0;flex:1">`;o.appendChild(r)} window.addO=addO;

async function saveTest(){
  const title=$('nTitle').value.trim(),dl=$('nDl').value,g5=+$('g5').value,g4=+$('g4').value,g3=+$('g3').value;
  if(!title||!dl)return alert('Заполните название и дату');
  const qs=[];
  document.querySelectorAll('#nQs .qb').forEach(b=>{const text=b.querySelector('.qtext').value.trim(),ors=[...b.querySelectorAll('.orow')],opts=ors.map(r=>r.querySelector('input[type=text]').value.trim());let cor=-1;ors.forEach((r,i)=>{if(r.querySelector('input[type=radio]').checked)cor=i});if(text&&opts.length>=2&&cor>=0)qs.push({text,options:opts,correct:cor})});
  if(!qs.length)return alert('Добавьте 1 вопрос с ответом!');
  
  const { error } = await supabase.from('tests').insert([{title, deadline: dl, questions: qs, grades: {g5,g4,g3}}]);
  if(error){ alert('Ошибка базы: '+error.message); return; }
  alert('Создан!');$('nTitle').value='';$('nDl').value='';$('nQs').innerHTML='';addQ();loadAdm();
} window.saveTest=saveTest;

async function loadAdm(){const L=$('admTests'),a=await getT();if(!a.length){L.innerHTML='<p style="color:#a06a7c">Нет тестов</p>';return}L.innerHTML='<h2 style="margin-bottom:10px;font-size:18px">Созданные тесты</h2>'+a.map(t=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffe4ef;flex-wrap:wrap;gap:10px"><div><b>${esc(t.title)}</b><br><small>до ${new Date(t.deadline).toLocaleString('ru-RU')}</small></div><button class="btn danger sm" onclick="delT('${t.id}')">Удалить</button></div>`).join('')} window.loadAdm=loadAdm;
async function delT(id){if(!confirm('Удалить?'))return;await supabase.from('tests').delete().eq('id',id);loadAdm()} window.delT=delT;

let cache=[];
function getGrade(score,total,g){if(!g)return{n:'-',cls:''};const p=total?(score/total)*100:0;if(p>=g.g5)return{n:'5',cls:'g5'};if(p>=g.g4)return{n:'4',cls:'g4'};if(p>=g.g3)return{n:'3',cls:'g3'};return{n:'2',cls:'g2'}}

async function loadRes(){
  const B=$('resList'),a=await getR(),tests=await getT();
  a.sort((x,y)=>new Date(y.submitted_at)-new Date(x.submitted_at));cache=a;
  if(!a.length){B.innerHTML='<p style="color:#a06a7c">Нет результатов</p>';return}
  const avg=Math.round(a.reduce((s,r)=>s+(r.total?r.score/r.total:0),0)/a.length*100);
  B.innerHTML=`<div class="stats"><div class="stat">${a.length}<span>сдач</span></div><div class="stat">${avg}%<span>средний</span></div></div><div style="overflow-x:auto"><table><tr><th>Дата</th><th>Тест</th><th>ФИО</th><th>Баллы</th><th>Оценка</th><th></th></tr>${a.map(r=>{const test=tests.find(x=>x.id==r.test_id);let g={n:'-',cls:''};if(test){const gr=typeof test.grades==='string'?JSON.parse(test.grades):test.grades;g=getGrade(r.score,r.total,gr)}return`<tr><td>${new Date(r.submitted_at).toLocaleString('ru-RU')}</td><td>${esc(r.test_title)}</td><td>${esc(r.fio)}<br><small>${esc(r.load)}</small></td><td><b>${r.score}/${r.total}</b></td><td><span class="grade ${g.cls}">${g.n}</span></td><td><button class="btn sm" onclick="showD('${r.id}')">Разбор</button></td></tr>`}).join('')}</table></div>`
} window.loadRes=loadRes;

async function showD(id){
  const r=cache.find(x=>x.id==id);if(!r)return;
  const t=(await getT()).find(x=>x.id==r.test_id);if(!t)return alert('Тест удалён');
  const gr=typeof t.grades==='string'?JSON.parse(t.grades):t.grades;
  const g=getGrade(r.score,r.total,gr),pct=Math.round((r.score/r.total)*100);
  const qs=typeof t.questions==='string'?JSON.parse(t.questions):t.questions;
  const ans=typeof r.answers==='string'?JSON.parse(r.answers):r.answers;
  let html=`<h2>${esc(r.fio)}</h2><p style="margin-bottom:10px">Тест: <b>${esc(t.title)}</b><br>Баллы: <b>${r.score}/${r.total}</b> (${pct}%)<br>Оценка: <span class="grade ${g.cls}">${g.n}</span></p><hr style="margin:10px 0;border:none;border-top:2px solid #ffe4ef">`;
  qs.forEach((q,i)=>{const ch=ans[i],ok=ch===q.correct;html+=`<div style="margin-bottom:12px"><div style="font-weight:600;margin-bottom:6px">${i+1}. ${esc(q.text)} ${ok?'<span class="ok">✓</span>':'<span class="bad">✗</span>'}</div>`;q.options.forEach((o,j)=>{const ic=j===q.correct,isel=j===ch;let cls='neutral';if(ic)cls='right';else if(isel)cls='wrong';html+=`<div class="${cls}">${esc(o)}${ic?' <span class="ok">← ответ</span>':''}${isel&&!ic?' <span class="bad">← выбран</span>':''}</div>`});html+='</div>'});
  html+=`<div style="text-align:right"><button class="btn" onclick="closeM()">Закрыть</button></div>`;
  $('mContent').innerHTML=html;$('mBack').classList.remove('hide')
} window.showD=showD;
function closeM(){$('mBack').classList.add('hide')} window.closeM=closeM;

async function exportXl(){
  if(!cache.length)return alert('Нет данных');
  const tests=await getT();
  const data=cache.map(r=>{
    const t=tests.find(x=>x.id==r.test_id);
    let g='-';
    if(t){const gr=typeof t.grades==='string'?JSON.parse(t.grades):t.grades;g=getGrade(r.score,r.total,gr).n}
    return{'Тест':r.test_title,'ФИО':r.fio,'Нагрузка':r.load,'Баллы':`${r.score}/${r.total}`,'Оценка':g,'Время':`${Math.floor(r.duration_sec/60)}м ${r.duration_sec%60}с`,'Дата':new Date(r.submitted_at).toLocaleString('ru-RU')}
  });
  const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(data);XLSX.utils.book_append_sheet(wb,ws,'Результаты');XLSX.writeFile(wb,`results_${new Date().toISOString().slice(0,10)}.xlsx`)
} window.exportXl=exportXl;

addQ();
</script>
</body>
</html>
